name: Offline regression tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          TRADER_OFFLINE: 'true'
      - run: node --test tests/*.test.cjs
  cpu-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip check
      - run: python -m pytest -q tests/test_alexnet_model.py tests/test_transformer_model.py tests/test_model_trainer.py tests/test_backup_bundle.py
        env:
          TRADER_OFFLINE: 'true'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
        env:
          TRADER_OFFLINE: 'true'
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nobitex-smoke .
      - run: python tests/container_smoke.py nobitex-smoke
